<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio de Grid-layout</title>
    <style>

      * {
         box-sizing: border-box;
         margin: 0;
      }


        div.container {
            display: grid;
            border: 2px solid black;
            grid-template-rows: 80px 40px 200px 40px;
            grid-template-columns: 1fr 15px 500px;
            gap: 5px;
        }

         div.header {
            background-color: rgba(255, 0, 0, 0.49);
            border: 1px dashed black;
            text-align: center;
            grid-row-start: 1;
            grid-row-end: 2;
            grid-column-start: 1;
            grid-column-end: 4;
            
         }

         div.menu {
            background-color: rgba(0, 0, 255, 0.411);
            border: 1px dashed black;
            text-align: center;
            grid-row-start: 2;
            grid-row-end: 3;
            grid-column-start: 1;
            grid-column-end: 4;
         }

         div.principal {
            background-color: rgba(255, 255, 0, 0.46);
            border: 1px dashed black;
            text-align: center;
            grid-area: 3 / 1 / 4 / 3;
         }

         div.second {
            background-color: rgba(0, 128, 0, 0.452);
            border: 1px dashed black;
            text-align: center;
            grid-area: 3 / 3 / 4 / 4;
         }

         div.footer {
            background-color: rgb(152, 23, 44);
             border: 1px dashed black;
             text-align: center;
             grid-row-start: 4;
             grid-row-end: 5;
             grid-column-start: 1;
             grid-column-end: 4;
         }
    </style>
</head>
<body>
  <div class="container">
      <div class="header">Header</div>
      <div class="menu">Menu</div>
      <div class="principal">Principal</div>
      <div class="second">Second</div>
      <div class="footer">Footer</div>
  </div>
</body>
</html>
