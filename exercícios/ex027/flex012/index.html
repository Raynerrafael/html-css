<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexible Box</title>
    <style>
        div.conteiner {
            background-color: lightsalmon;
            display: flex;
            flex-flow: row nowrap;
        }

        div.item{
            background-color: lightblue;
            border: 1px solid black;
            text-align: center ;
           
        }

        div#cxa {
        

             flex: 1 0 200px;
        }

        div#cxb {
            

             flex: 1 1 150px;
        }

        div#cxc {
            flex-shrink: 8;
            flex-grow: 1;
             flex-basis: auto;

             flex: 1 8 auto;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div id="cxa" class="item">A</div>
        <div id="cxb" class="item">B</div>
        <div id="cxc" class="item">C</div>
    </div>
</body>
</html>
